<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Congklak</title>
<style>
  :root { --wood:#8a5a2b; --wood-d:#5e3a17; --pit:#3b2410; --cream:#f6ecd9; --gold:#e9b949; --green:#2f8f5b; --red:#b8442e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:#2b1d10; color:var(--cream); min-height:100vh; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { margin: 8px 0 16px; letter-spacing: .5px; }
  h1 small { font-weight: 400; font-size: .5em; opacity:.7; margin-left:8px; }
  .card { background:#3a2a19; border-radius:14px; padding:16px; margin-bottom:16px; }
  input, button { font: inherit; border-radius: 10px; border: 0; padding: 10px 14px; }
  input { background:var(--cream); color:#222; }
  button { background:var(--gold); color:#2b1d10; font-weight:600; cursor:pointer; }
  button.secondary { background:#5a4630; color:var(--cream); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:140px; }
  .err { color:#ff9c8a; min-height:1.2em; margin-top:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #4d3a25; }
  th { opacity:.7; font-weight:500; font-size:.85em; }
  td.n, th.n { text-align:right; }
  tr.me td { color: var(--gold); font-weight:600; }
  .hidden { display:none !important; }

  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .status { font-size:1.15em; font-weight:600; }
  .who { font-size:.95em; opacity:.9; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#777; display:inline-block; }
  .dot.on { background:#5fd68c; }
  .turn { color: var(--gold); font-weight:700; }

  .board { background: linear-gradient(var(--wood), var(--wood-d)); border-radius: 40px; padding: 16px;
           display:grid; grid-template-columns: 1.2fr repeat(7, 1fr) 1.2fr; grid-template-rows: 1fr 1fr; gap: 10px;
           box-shadow: 0 8px 24px #0008, inset 0 2px 6px #fff3; }
  .pit { background: radial-gradient(circle at 50% 35%, #2a180a, var(--pit)); border-radius: 50%; aspect-ratio:1;
         position:relative; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; padding:14%;
         box-shadow: inset 0 4px 10px #000a; transition: box-shadow .15s, transform .15s; border:0; color:inherit; }
  .store { grid-row: span 2; border-radius: 40px; aspect-ratio:auto; align-content:center; padding: 8px; }
  .pit .seed { width: 11%; min-width:6px; aspect-ratio:1; border-radius:50%; background: radial-gradient(circle at 35% 30%, #fff8, #d9a441 60%, #8a5a1a); flex: none; }
  .store .seed { width: 14%; }
  .count { position:absolute; right:6%; bottom:4%; font-size:.8em; font-weight:700; background:#000a; border-radius:9px; padding:0 6px; }
  .pit.mine.can { cursor:pointer; box-shadow: inset 0 4px 10px #000a, 0 0 0 3px var(--gold); }
  .pit.mine.can:hover { transform: scale(1.06); }
  .pit.hit { box-shadow: inset 0 4px 10px #000a, 0 0 0 4px #fff, 0 0 18px #fff8; transform: scale(1.05); }
  .pit.cap { box-shadow: inset 0 4px 10px #000a, 0 0 0 4px var(--green), 0 0 18px var(--green); }
  .label { text-align:center; font-size:.85em; opacity:.85; margin: 6px 0; }
  .share input { width:100%; }
  .code { font-size:2em; letter-spacing: 6px; font-weight:800; color:var(--gold); }
  .log { font-size:.9em; opacity:.8; min-height:1.4em; margin-top:10px; text-align:center; }
  @media (max-width:560px){ .board{ padding:8px; gap:5px; border-radius:24px;} .count{ font-size:.65em; padding:0 4px;} .pit{ padding:10%; } }
</style>
</head>
<body>
<main>
  <h1>Congklak <small>play with friends, live</small></h1>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="card">
      <div class="row">
        <input id="name" class="grow" maxlength="16" placeholder="Your name" autocomplete="off">
      </div>
      <div class="row" style="margin-top:10px">
        <button id="create">Create a game</button>
        <span style="opacity:.6">or</span>
        <input id="code" maxlength="4" placeholder="CODE" style="width:100px;text-transform:uppercase">
        <button id="join" class="secondary">Join</button>
      </div>
      <div id="lobbyErr" class="err"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Rankings</h3>
      <div style="opacity:.7;font-size:.85em;margin-bottom:6px">Win = 3 points, draw = 1, loss = 0. Ties are broken by wins, then seeds collected.</div>
      <div id="rank"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="bar">
      <div id="status" class="status"></div>
      <button id="leave" class="secondary">Leave</button>
    </div>
    <div id="invite" class="card share hidden">
      <div style="margin-bottom:6px">Waiting for a friend. Send them this link, or the code:</div>
      <div class="code" id="roomCode"></div>
      <div class="row" style="margin-top:8px">
        <input id="link" class="grow" readonly>
        <button id="copy">Copy link</button>
      </div>
    </div>
    <div class="bar"><div class="who" id="topWho"></div><div></div></div>
    <div class="board" id="board"></div>
    <div class="bar" style="margin-top:10px"><div class="who" id="botWho"></div><div></div></div>
    <div class="log" id="log"></div>
    <div id="over" class="card hidden" style="margin-top:14px;text-align:center">
      <div id="overMsg" style="font-size:1.4em;font-weight:700;margin-bottom:10px"></div>
      <button id="rematch">Rematch</button>
      <div id="rematchNote" style="opacity:.7;margin-top:8px"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pid = localStorage.pid || (localStorage.pid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()));
$('name').value = localStorage.name || '';

const api = async (path, body) => {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- lobby ----------
async function loadRank() {
  const rows = await (await fetch('/api/leaderboard')).json();
  const me = (localStorage.name || '').toLowerCase();
  $('rank').innerHTML = rows.length
    ? `<table><tr><th>#</th><th>Player</th><th class="n">Pts</th><th class="n">Played</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">Seeds</th></tr>` +
      rows.map((r) => `<tr class="${r.name.toLowerCase() === me ? 'me' : ''}"><td>${r.rank}</td><td>${esc(r.name)}</td><td class="n">${r.points}</td><td class="n">${r.played}</td><td class="n">${r.wins}</td><td class="n">${r.draws}</td><td class="n">${r.losses}</td><td class="n">${r.seeds}</td></tr>`).join('') + '</table>'
    : '<div style="opacity:.7">No games played yet. Be the first on the board!</div>';
}
function getName() {
  const n = $('name').value.replace(/\s+/g, ' ').trim();
  if (!n) { $('lobbyErr').textContent = 'Please enter your name first.'; $('name').focus(); return null; }
  localStorage.name = n;
  return n;
}
$('create').onclick = async () => {
  const name = getName(); if (!name) return;
  try { enter((await api('/api/create', { name })).room); } catch (e) { $('lobbyErr').textContent = e.message; }
};
$('join').onclick = async () => {
  const name = getName(); if (!name) return;
  const room = $('code').value.trim().toUpperCase();
  if (!room) { $('lobbyErr').textContent = 'Enter the 4-letter code.'; return; }
  try { enter((await api('/api/join', { name, room })).room); } catch (e) { $('lobbyErr').textContent = e.message; }
};

// ---------- game ----------
let es = null, roomCode = null, latest = null, shown = null, seq = -1, animating = false;

function enter(code) {
  roomCode = code;
  history.replaceState(null, '', '?room=' + code);
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('over').classList.add('hidden');
  seq = -1; latest = null; shown = null;
  if (es) es.close();
  es = new EventSource(`/api/events?room=${code}&pid=${pid}`);
  es.onmessage = (m) => onState(JSON.parse(m.data));
}
$('leave').onclick = () => {
  if (es) es.close();
  roomCode = null;
  history.replaceState(null, '', location.pathname);
  $('game').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  loadRank();
};
$('copy').onclick = async () => {
  $('link').select();
  try { await navigator.clipboard.writeText($('link').value); $('copy').textContent = 'Copied!'; setTimeout(() => ($('copy').textContent = 'Copy link'), 1500); } catch {}
};
$('rematch').onclick = () => api('/api/rematch', { room: roomCode }).catch(() => {});

function onState(s) {
  latest = s;
  if (animating) return;
  if (seq >= 0 && s.moveSeq > seq && s.frames.length) {
    seq = s.moveSeq;
    animate(s);
  } else {
    seq = s.moveSeq;
    shown = s.board;
    render(s);
  }
}

async function animate(s) {
  animating = true;
  const flip = s.you === 1;
  for (const f of s.frames) {
    shown = f.board;
    render(s, { hit: f.pos, hand: f.hand, cap: f.note === 'capture' });
    await new Promise((r) => setTimeout(r, f.note === 'capture' ? 700 : f.note === 'pick' ? 380 : 230));
  }
  animating = false;
  shown = latest.board; // may be newer than s if several moves arrived
  seq = latest.moveSeq;
  render(latest);
}

function pitEl(i, s, opts, mine, canMove) {
  const n = shown[i];
  const b = document.createElement(mine && canMove && n > 0 ? 'button' : 'div');
  b.className = 'pit' + (mine ? ' mine' : '') + (mine && canMove && n > 0 ? ' can' : '') + (opts.hit === i ? (opts.cap ? ' cap' : ' hit') : '');
  const dots = Math.min(n, 18);
  b.innerHTML = '<span class="seed"></span>'.repeat(dots) + (n ? `<span class="count">${n}</span>` : '');
  if (mine && canMove && n > 0) b.onclick = () => api('/api/move', { room: roomCode, hole: i }).catch((e) => ($('log').textContent = e.message));
  return b;
}

function render(s, opts = {}) {
  const me = s.you < 0 ? 0 : s.you, opp = 1 - me;
  const names = s.players.map((p) => (p ? p.name : '…'));
  const canMove = s.status === 'playing' && s.turn === s.you && !animating && !opts.hand;
  const bd = $('board');
  bd.innerHTML = '';
  const store = (p, col) => {
    const e = pitEl(p * 8 + 7, s, opts, false, false);
    e.classList.add('store');
    e.style.gridColumn = col; e.style.gridRow = '1 / span 2';
    return e;
  };
  bd.append(store(opp, 1));
  // top row: opponent holes, shown right-to-left from my view
  for (let k = 0; k < 7; k++) { const e = pitEl(opp * 8 + 6 - k, s, opts, false, false); e.style.gridRow = 1; e.style.gridColumn = k + 2; bd.append(e); }
  for (let k = 0; k < 7; k++) { const e = pitEl(me * 8 + k, s, opts, true, canMove); e.style.gridRow = 2; e.style.gridColumn = k + 2; bd.append(e); }
  bd.append(store(me, 9));

  const who = (p, label) => {
    const pl = s.players[p];
    return `<span class="dot ${pl && pl.online ? 'on' : ''}"></span>${esc(names[p])}${label} — <b>${shown[p * 8 + 7]}</b> in store` + (s.status === 'playing' && s.turn === p ? ' <span class="turn">◀ turn</span>' : '');
  };
  $('topWho').innerHTML = who(opp, s.you < 0 ? '' : '');
  $('botWho').innerHTML = who(me, s.you >= 0 ? ' (you)' : '');

  const inv = $('invite');
  inv.classList.toggle('hidden', s.status !== 'waiting');
  $('roomCode').textContent = s.code;
  $('link').value = location.origin + '/?room=' + s.code;

  let st = '';
  if (s.status === 'waiting') st = 'Waiting for a friend to join…';
  else if (s.status === 'playing') st = opts.hand ? `Sowing… ${opts.hand} seed${opts.hand === 1 ? '' : 's'} in hand` : s.turn === s.you ? 'Your turn — pick a glowing hole' : `${names[s.turn]}'s turn`;
  else st = 'Game over';
  $('status').textContent = st;

  if (!animating) {
    const lm = s.lastMove;
    $('log').textContent = lm ? `${names[lm.by]} played${lm.captured ? ` and captured ${lm.captured} seeds` : ''}${lm.extra ? ' and gets another turn' : ''}.` : '';
  } else $('log').textContent = '';

  const over = $('over');
  const isOver = s.status === 'over' && !animating;
  over.classList.toggle('hidden', !isOver);
  if (isOver) {
    const a = s.board[7], c = s.board[15];
    $('overMsg').textContent = s.winner === -1 ? `Draw, ${a} – ${c}` : s.winner === s.you ? `You win! ${s.board[s.you * 8 + 7]} – ${s.board[(1 - s.you) * 8 + 7]}` : `${names[s.winner]} wins ${s.board[s.winner * 8 + 7]} – ${s.board[(1 - s.winner) * 8 + 7]}`;
    $('rematch').disabled = s.you < 0 || s.rematch[s.you];
    $('rematchNote').textContent = s.you >= 0 && s.rematch[s.you] ? 'Waiting for your friend…' : s.rematch[opp] ? `${names[opp]} wants a rematch` : 'The other player starts first next round.';
  }
}

// ---------- start ----------
loadRank();
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) {
  const code = urlRoom.toUpperCase();
  $('code').value = code;
  if (localStorage.name) {
    api('/api/join', { name: localStorage.name, room: code }).then(() => enter(code)).catch((e) => { $('lobbyErr').textContent = e.message; history.replaceState(null, '', location.pathname); });
  } else {
    $('lobbyErr').textContent = 'Enter your name, then press Join to enter room ' + code + '.';
  }
}
</script>
</body>
</html>
